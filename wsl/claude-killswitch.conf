# Настройки kill switch для Claude в WSL. Файл: /etc/claude-killswitch.conf
# После правки: sudo systemctl restart claude-killswitch

# Разрешённые выходы VPN — адреса, которые видят сайты (IP твоего VPS),
# через пробел. IPv4 и IPv6. Пусто — Claude закрыт всегда.
ALLOWED_EXITS=""

# Как часто проверять выход, секунд.
CHECK_INTERVAL=5

# Убивать запущенный Claude Code, когда VPN пропал (yes/no).
KILL_ON_CLOSE=yes

# Сети Anthropic (опубликованы Anthropic: claude.ai, claude.com, api.anthropic.com).
ANTHROPIC_V4="160.79.104.0/23"
ANTHROPIC_V6="2607:6bc0::/48"

# Дополнительные домены, которые закрываются вместе с Claude (телеметрия и т.п.).
# Их адреса резолвятся раз в RESOLVE_EVERY секунд.
EXTRA_DOMAINS="http-intake.logs.us5.datadoghq.com statsig.anthropic.com downloads.claude.ai"
RESOLVE_EVERY=300
