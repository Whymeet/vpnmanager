# Конфиг vpnmanager для Windows: Claude только через свои VPN.
# Применяет его установка (install-windows.cmd) сама. Вручную — PowerShell от имени
# администратора, из папки проекта: appguard apply configs\claude-vpn.conf
#
# Свои VPN здесь не пишутся: их вводит пользователь в окне «Мои VPN»
# (открывается при установке; потом — щит у часов → «Мои VPN…»).

# Claude Desktop (пакет Store) — в нём же Cowork.
app Claude
# Claude Code для Windows, если поставлен (нет — строка пропускается).
app %USERPROFILE%\.local\bin\claude.exe

# Сайты Claude закрыты для всех программ (браузеры тоже) вне проверенного VPN.
protect anthropic.com claude.ai claude.com claudeusercontent.com claude.site clau.de http-intake.logs.us5.datadoghq.com
protect 160.79.104.10 2607:6bc0::10

# Claude открыт только через VPN из списка «Мои VPN». Пока список пуст — закрыт.
rule mine

notifications on
