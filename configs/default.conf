# Конфиг vpnlock. Применяет его ./configs/setup.sh — он же ставит vpnlock,
# если его ещё нет. Один конфиг на macOS и Linux: программы, которой на этом
# компьютере нет, скрипт пропускает.
#
# Перед запуском впиши свои выходы VPN строками exit — по одной на сервер.
# Правило здесь «только мои выходы»: пока выходов нет, защищённые сервисы
# закрыты. Выход можно добавить и потом: подключи VPN и выполни
# vpnlock remember <имя> — запомнится текущий выход.
#
# На Windows скрипта нет: те же строки выполняются командами vpnlock по одной в
# PowerShell от имени администратора (vpnlock remember …, vpnlock rule mine,
# vpnlock protect …). Программу там называют полным путём к её .exe:
# vpnlock add "<путь к claude.exe>".
#
# Формат — по команде в строке, # — комментарий:
#   exit <имя> <адрес>         выход VPN: адрес, который видят сайты (не адрес сервера)
#   rule mine|any              mine — только мои выходы, any — любой выход не из России
#   app <имя|путь>             программа, которой сеть — только через проверенный VPN
#   protect <домен|адрес>...   закрыть сервис для всех программ везде, кроме VPN
#   import <файл>              то же списком из файла (путь — от этой папки)
#   notifications on|off       уведомления о закрытии сервисов

# exit Германия 203.0.113.5
rule mine

app claude

protect anthropic.com claude.ai claude.com http-intake.logs.us5.datadoghq.com

notifications on
