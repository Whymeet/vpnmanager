# Конфиг appguard для Linux. Применяет его `appguard apply` после установки:
# команда сама берёт конфиг своей системы из клона. Запускать можно сколько
# угодно раз — что уже настроено, остаётся как есть; программы, которой на этом
# компьютере нет, команда пропускает. Конфиг только добавляет: снять — appguard
# remove, unprotect, forget.
#
# Свои выходы VPN сюда не пишут: они у каждого свои. После apply —
#   appguard remember <имя>    (VPN включён) для каждого своего VPN
#   appguard rule mine
#
# Формат — по команде в строке, # — комментарий:
#   app <имя|путь>             программа или служба systemd (nginx.service), пакет snap —
#                              по имени; сеть ей — только через проверенный VPN
#   protect <домен|адрес>...   закрыть сервис для всех программ везде, кроме VPN
#                              (домены — только с systemd-resolved, адреса — всегда)
#   import <файл>              то же списком из файла (путь — от этой папки)
#   notifications on|off       уведомления о закрытии сервисов
# Для своего конфига вне репозитория (appguard apply ~/my.conf) есть ещё:
#   exit <имя> <адрес>         выход VPN: адрес, который видят сайты (не адрес сервера)
#   rule mine|any              mine — только мои выходы, any — любой выход не из России

app claude

protect anthropic.com claude.ai claude.com http-intake.logs.us5.datadoghq.com

notifications on
