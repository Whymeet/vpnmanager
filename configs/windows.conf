# Конфиг vpnlock для Windows. Применяет его `vpnlock apply` в PowerShell,
# открытом от имени администратора: команда сама берёт конфиг своей системы из
# клона. Запускать можно сколько угодно раз — что уже настроено, остаётся как
# есть; программы, которой на этом компьютере нет, команда пропускает. Конфиг
# только добавляет: снять — vpnlock remove, unprotect, forget.
#
# Свои выходы VPN сюда не пишут: они у каждого свои. После apply —
#   vpnlock remember <имя>    (VPN включён) для каждого своего VPN
#   vpnlock rule mine
#
# Формат — по команде в строке, # — комментарий:
#   app <имя|путь>             программа — по имени ярлыка в меню «Пуск» (Notion) или по пути
#                              к exe; %USERPROFILE% и ~ раскрываются; кавычки не нужны
#   protect <домен|адрес>...   закрыть сервис для всех программ везде, кроме VPN
#   import <файл>              то же списком из файла (путь — от этой папки)
#   notifications on|off       уведомления о закрытии сервисов
# Для своего конфига вне репозитория (vpnlock apply ~\my.conf) есть ещё:
#   exit <имя> <адрес>         выход VPN: адрес, который видят сайты (не адрес сервера)
#   rule mine|any              mine — только мои выходы, any — любой выход не из России

# Claude Code: консольной команды по имени Windows не ищет — путь, куда его ставит
# установщик Claude Code.
app %USERPROFILE%\.local\bin\claude.exe

protect anthropic.com claude.ai claude.com http-intake.logs.us5.datadoghq.com

notifications on
