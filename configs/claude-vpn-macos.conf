# Конфиг vpnmanager для macOS: Claude только через свои VPN.
# Применяет его установка (install-mac.command) сама. Вручную — в Терминале, без sudo,
# из папки проекта: appguard apply configs/claude-vpn-macos.conf
#
# Свои VPN здесь не пишутся: их вводит пользователь в окне «Мои VPN»
# (открывается при установке; потом — щит в строке меню → «Мои VPN…»).

# Claude Desktop (в нём же Cowork).
app Claude
# Claude Code — консольная программа claude (нет — строка пропускается).
app claude

# Сайты Claude закрыты для всех программ (браузеры тоже) вне проверенного VPN.
protect anthropic.com claude.ai claude.com claudeusercontent.com claude.site clau.de http-intake.logs.us5.datadoghq.com
protect 160.79.104.10 2607:6bc0::10

# Claude открыт только через VPN из списка «Мои VPN». Пока список пуст — закрыт.
rule mine

notifications on
